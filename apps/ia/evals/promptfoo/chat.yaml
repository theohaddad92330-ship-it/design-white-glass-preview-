      - type: javascript
        metric: no-empty-promise
        value: |
          const o = JSON.parse(output);
          return !/je poursuis sur le reste/i.test(o.text);

  - description: "#4421.2 (R22) missions sans consultant -> le marché (comptes qui recrutent), aucune question"
    vars:
      message: "Trouve-moi des missions."
    assert:
      - type: python
        metric: laura-acts
        value: file://asserts.py:laura_acts
      - type: javascript
        metric: market-search
        value: |
          const o = JSON.parse(output);
          return o.tool_calls.some(c => c.name === 'run_account_search') && !/consultant précis/i.test(o.text);

  - description: "#4438.3 (R22) comptes Java -> jamais « Et derrière ta question… Je peux le qualifier avec toi »"
    vars:
      message: "Trouve-moi des comptes Java."
    assert:
      - type: python
        metric: laura-acts
        value: file://asserts.py:laura_acts
      - type: javascript
        metric: no-fixed-sentence
        value: |
          const o = JSON.parse(output);
          return !/(derrière ta question|qualifier avec toi)/i.test(o.text);

  - description: "#4421.1 (R22-LAURA-V14) missions d'un consultant -> un seul appel find_accounts_for_talent, aucune question, aucun texte avant l'outil"
    vars:
      message: "Pour Léa Marchand, trouve-moi des missions."
    assert:
      - type: python
        metric: laura-acts
        value: file://asserts.py:laura_acts
      - type: javascript
        metric: talent-direct
        value: |
          const o = JSON.parse(output);
          const names = o.tool_calls.map(c => c.name);
          return names.includes('find_accounts_for_talent') && !names.includes('search_talents') && !/\?\s*$/.test(o.text);


  # #4462 (retour Exteam 22/10) — une LISTE de noms absents de l'espace : un seul appel du lot, avec
  # toute la liste, jamais « aucun compte » puis « Je poursuis sur le reste. » sans rien lancer.
  - description: "#4462 liste de 15 noms hors espace -> analyze_named_companies avec toute la liste, aucune reprise à vide"
    vars:
      message: "Voici 15 comptes : Infovista, Guerbet, Théa, Vetoquinol, Latécoère, LISI, Daher, Voyageurs du Monde, Virbac, Ipsen, Servier, Pierre Fabre, bioMérieux, Pierre & Vacances-Center Parcs, LFB. Donne-moi les périmètres IT/DSI pertinents et les meilleurs interlocuteurs de niveau manager ou donneur d'ordre, pour prioriser par où commencer."
    assert:
      - type: python
        metric: laura-acts
        value: file://asserts.py:laura_acts
      - type: javascript
        metric: batch-launch
        value: |
          const o = JSON.parse(output);
          const call = o.tool_calls.find(c => c.name === 'analyze_named_companies');
          return Boolean(call) && (call.input?.companies || []).length >= 15
            && !/je poursuis sur le reste|relance la même demande|sera disponible/i.test(o.text);

  - description: "#4408.1 (R22-LAURA-V14) 10 comptes sans gros process achat -> purchasing_process=light et volume 10 demandé à l'outil"
    vars:
      message: "Trouve-moi 10 comptes en Île-de-France dans les services financiers sans gros process achat, qui recrutent en IT."
    assert:
      - type: python
        metric: laura-acts
        value: file://asserts.py:laura_acts
      - type: javascript
        metric: volume-and-constraint
        value: |
          const o = JSON.parse(output);
          const call = o.tool_calls.find(c => c.name === 'run_account_search');
          return !!call && call.input.purchasing_process === 'light' && (call.input.limit >= 10 || call.input.requested_count >= 10);

  - description: "#4438.1 (R22-LAURA-V14) « qui recrutent en data » -> la compétence va dans technologies, jamais dans keywords (raison sociale)"
    vars:
      message: "Trouve-moi tous les comptes qui recrutent en data en France."
    assert:
