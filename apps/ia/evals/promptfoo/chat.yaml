      - type: javascript
        metric: names-the-neighbour
        value: |
          const o = JSON.parse(output);
          return /(scala|kotlin)/i.test(o.text);

  - description: "#4438.3 (R22-LAURA-V14) la prose ne contredit pas la carte (10 comptes listés)"
    vars:
      message: "Trouve-moi 10 comptes aéronautique à Toulouse."
    assert:
      - type: python
        metric: laura-acts
        value: file://asserts.py:laura_acts
      - type: javascript
        metric: prose-vs-card
        value: |
          const o = JSON.parse(output);
          return !/(ne permet pas de confirmer|pas pu confirmer)\s+\d+\s+comptes/i.test(o.text);
