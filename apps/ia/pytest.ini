[pytest]
asyncio_mode = auto

# Upstream contract tests hit REAL provider APIs (network + money), so they are
# excluded from every default `pytest` run. Run them explicitly:
#   make contracts          (or)   pytest -m upstream_contract
# CI runs them once a day — see .github/workflows/upstream-contracts.yml
markers =
    upstream_contract: live call against a real upstream provider API (network + cost)

addopts = -m "not upstream_contract"

# Un test qui se fige doit échouer NOMMÉ, pas figer le job CI jusqu'à son
# timeout de job (30 min dans ci.yml — le job « Test (IA) » restait à 58 %
# sans dire quel test). `thread` : la méthode `signal` ne peut pas
# interrompre un teardown de boucle asyncio bloqué.
timeout = 60
timeout_method = thread
