changelog:
  id: 2026-10-31-decouvrir-i-retours
  comment: 'Découvrir lot I (#5002 #4997 #5001 #4999 #5006 #4973) — six retours récents'
  fr:
    date: 31 octobre 2026
    title: Découvrir lit mieux ta recherche
    items:
      - 'Une ville tapée seule en fin de phrase (« Data Strasbourg ») devient la zone de la recherche.'
      - 'Quand les filtres vident la liste, l’écran nomme celui qui la vide et ce que son retrait rendrait.'
      - 'L’onglet Contacts dit « 23 contacts sur 11 comptes ».'
      - 'Un filtre « Freelance seul » lit le contrat réel de l’offre, sans jamais le deviner.'
      - 'Un compte de moins de 20 salariés porte un badge « hors cible » avec sa raison.'
      - 'Les secteurs choisis à l’onboarding sont proposés dans le rail, sans être posés d’office.'
  en:
    date: October 31, 2026
    title: Discover reads your search better
    items:
      - 'A city typed alone at the end of a sentence (“Data Strasbourg”) becomes the search area.'
      - 'When filters empty the list, the screen names the one that does and what removing it would return.'
      - 'The Contacts tab reads “23 contacts at 11 accounts”.'
      - 'A “Freelance only” filter reads the offer’s real contract, never guessing it.'
      - 'An account under 20 employees carries an “off target” badge with its reason.'
      - 'The sectors picked at onboarding are suggested in the rail, never applied on their own.'
