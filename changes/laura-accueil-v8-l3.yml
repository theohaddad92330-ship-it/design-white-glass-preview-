changelog:
  id: 2026-10-31-laura-accueil-v8-l3
  comment: 'Accueil de Laura forme V8 (#5042) et chemin unique « J’ai un compte en tête » (#5011 #5027)'
  fr:
    date: 31 octobre 2026
    title: Un accueil plus simple pour Laura
    items:
      - 'L’accueil garde trois façons de commencer et un lien vers toutes les idées de demandes ; la rubrique de scénarios et les amorces propres au compte ciblé disparaissent.'
      - 'La barre « garde en tête » quitte la conversation : la mention sur les erreurs reste sous la saisie, la mémoire se lit dans Réglages.'
      - 'Un seul chemin « J’ai un compte en tête » : il ouvre un fil cadré sur le compte choisi, avec la saisie préparée pour demander le profil.'
  en:
    date: October 31, 2026
    title: A simpler home for Laura
    items:
      - 'The home keeps three ways to start and a link to all request ideas; the scenarios section and the target-account starters are gone.'
      - 'The "keeps in mind" bar leaves the conversation: the note about errors stays under the input, and memory is read in Settings.'
      - 'A single "I have an account in mind" path: it opens a thread framed on the chosen account, with the input prepared to ask for the profile.'
