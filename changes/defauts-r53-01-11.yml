changelog:
  id: 2026-11-01-defauts-r53
  comment: 'Défauts de la recette prod r53 (#2164.29 #2164.30 #2164.34 #2164.38 #2164.39 #2157.17 #2408.40)'
  fr:
    date: 1 novembre 2026
    title: Actualisation visible, écartés nommés, tableau des missions stable
    items:
      - 'Sur un compte avec brief, ce que l’actualisation a dit (ce que nous savions déjà, ce qui est nouveau, ce que je ferais maintenant, contacts non reconfirmés) se lit dès l’arrivée sur le dossier.'
      - 'Dans l’aperçu de création de cible, une fiche retirée est nommée parmi les écartées.'
      - 'Dans la vue liste des missions, la colonne Statut garde sa largeur ; le tableau défile dans son cadre quand il est large.'
  en:
    date: November 1, 2026
    title: Refresh visible, set-aside items named, steady missions table
    items:
      - 'On an account with a brief, what the refresh found (what we already knew, what is new, what I would do now, contacts not reconfirmed) is read as soon as you land on the file.'
      - 'In the target creation preview, a removed item is named among the set-aside ones.'
      - 'In the missions list view, the Status column keeps its width; the table scrolls inside its frame when wide.'
