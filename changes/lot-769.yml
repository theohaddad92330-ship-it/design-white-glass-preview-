lot: lot-769
issues: [4816, 5004]

changelog:
  id: 2026-11-01-lot-769
  comment: 'Lot 769 (#4816, #5004) — Historique des signaux : la région lue sur chaque besoin, un axe Technos, les offres d’emploi typées « Recrutement »'
  fr:
    date: 1 novembre 2026
    title: 'Historique des signaux : chercher par techno et par région'
    items:
      - 'Chaque besoin passé porte sa région quand on la sait — le lieu de l’offre ou du besoin, à défaut le siège du compte. « Java à Lille » propose enfin Hauts-de-France. Un besoin dont on ne connaît pas le lieu n’a pas de région : rien n’est deviné.'
      - 'Un nouveau filtre « Technos » : les compétences des offres et les technos que le titre nomme (Java, SAP, Power BI…), avec leur effectif. Il se croise avec la zone, la période et le volume.'
      - 'Une offre d’emploi (H/F, CDI, stage, « recrute »…) est rangée en Recrutement même quand l’analyse l’avait étiquetée « Projet » ; une nomination reste dans l’équipe.'
      - 'L’Historique affiche son état de chargement pendant la requête au lieu d’une page vide.'
  en:
    date: November 1, 2026
    title: 'Signals history: search by tech and by region'
    items:
      - 'Each past need carries its region when we know it — the offer’s or need’s location, otherwise the account’s head office. "Java in Lille" now offers Hauts-de-France. A need with no known location has no region: nothing is guessed.'
      - 'A new "Technologies" filter: the skills of the offers and the technologies a title names (Java, SAP, Power BI…), with their counts. It combines with zone, period and volume.'
      - 'A job offer (M/F, permanent contract, internship, "is hiring"…) is filed under Hiring even when the analysis had labelled it "Project"; an appointment stays under Team.'
      - 'History shows its loading state during the request instead of a blank page.'
