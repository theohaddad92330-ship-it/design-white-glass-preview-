  comment: 'Découvrir : le rayon en km tient, chaque carte dit sa distance (#5069)'
  fr:
    date: 2 novembre 2026
    title: Découvrir — le rayon en km tient, chaque carte dit sa distance
    items:
      - 'Un compte dont le registre ne publie pas la position est mesuré depuis sa commune : Lille, Lesquin ou Mouvaux restent dans les 25 km de Lille.'
      - 'Chaque carte dit sa distance ; « Élargi au département » ne reste que sur une carte réellement hors rayon, et une distance inconnue se dit « distance inconnue ».'
      - 'Dans chaque partie de la liste, les comptes « hors cible : moins de 20 salariés » passent après les autres.'
  en:
    date: November 2, 2026
    title: Discover — the km radius holds, every card states its distance
    items:
      - 'An account whose registry entry has no published position is measured from its municipality: Lille, Lesquin or Mouvaux stay within 25 km of Lille.'
      - 'Every card states its distance; "Widened to the department" stays only on a card truly beyond the radius, and an unknown distance reads "distance unknown".'
      - 'Within each part of the list, "off target: under 20 employees" accounts come after the others.'
