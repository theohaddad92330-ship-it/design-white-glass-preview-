changelog:
  id: 2026-11-01-lot-767
  comment: 'Lot 767 (#5066) — Signaux › Historique au même niveau que l’onglet « Signaux et besoins » d’un compte'
  fr:
    date: 1 novembre 2026
    title: L’historique des signaux montre les besoins, en détail
    items:
      - 'Le dépli d’un compte montre chaque besoin passé comme dans l’onglet du compte : type, titre, détail, compétences, TJM, issue et lien.'
      - 'Les faits sur l’entreprise (forme sociale, gérants, annonces légales) ne sont plus comptés comme des besoins : ils sont rangés dans « Autres faits », sans doublons.'
  en:
    date: November 1, 2026
    title: Signal history shows needs, in detail
    items:
      - 'An account’s expanded row shows each past need as in the account tab: type, title, detail, skills, day rate, outcome and link.'
      - 'Company facts (legal form, managers, legal notices) are no longer counted as needs: they sit under "Other facts", without duplicates.'
