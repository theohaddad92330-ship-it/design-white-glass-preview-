issues: [2095, 2107, 2391]

changelog:
  id: 2026-10-31-vieilles-l1-briefing-moteur
  comment: 'L1 briefing (#2095 #2107 #2391) — Aujourd’hui voit cinq familles de plus et dit ce qu’il faut retenir'
  fr:
    date: 31 octobre 2026
    title: Aujourd’hui voit plus loin, et dit ce qu’il faut retenir
    items:
      - 'Nouvelles cartes : facture bloquée (relevé non validé, contesté, rejeté…), donnée critique manquante, mission qui démarre, avenant non signé, interlocuteur parti, CRM à reconnecter.'
      - Chaque carte dit en une phrase ce qu’il faut retenir, et ce qui arrive si rien n’est fait quand on le sait.
      - Une mission qui finit dans le mois passe devant un compte qui a bougé ; un blocage qui attend le client passe en dernier.
      - La carte d’un compte propose l’angle d’attaque déjà calculé par l’analyse.
      - Un objet déjà dans tes tâches du jour n’apparaît plus aussi en priorité.
      - Le résultat et la durée réelle que tu notes sur un bloc de ton plan de journée se relisent.
  en:
    date: October 31, 2026
    title: Today sees further, and says what to take away
    items:
      - 'New cards: blocked invoice (timesheet not approved, disputed, rejected…), missing critical data, assignment starting, unsigned amendment, contact who left, CRM to reconnect.'
      - Each card says in one sentence what to take away, and what happens if nothing is done when we know it.
      - An assignment ending within the month comes before an account that moved; a block waiting on the client comes last.
      - An account card suggests the attack angle the analysis already computed.
      - An object already in today’s tasks no longer also shows up as a priority.
      - The outcome and actual duration you note on a block of your day plan can be read back.
