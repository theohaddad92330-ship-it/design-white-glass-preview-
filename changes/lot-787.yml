changelog:
  id: 2026-11-03-lot-787
  comment: 'Lot 787 — la modale d’un signal montre toujours les personnes à contacter, même structure partout'
  fr:
    date: 3 novembre 2026
    title: Les personnes à contacter, dans toute modale de signal
    items:
      - 'Ouvrir un signal depuis Signaux, l’Historique ou la fiche compte montre toujours le bloc « Personnes à contacter ».'
      - 'Quand personne de connu ne recoupe le signal, le bloc le dit et mène aux contacts du compte, sans liste générique.'
      - 'Signaux ouvre la même modale que l’Historique : même description, mêmes blocs, dans le même ordre.'
  en:
    date: November 3, 2026
    title: People to contact in every signal dialog
    items:
      - 'Opening a signal from Signals, History or the account page always shows the "People to contact" block.'
      - 'When no known person matches the signal, the block says so and leads to the account contacts, with no generic list.'
      - 'Signals opens the same dialog as History: same description, same blocks, in the same order.'
