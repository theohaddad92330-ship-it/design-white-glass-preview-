      /**
       * #2102.4 (L3 Agenda, 31/10/2026) — L'IMPORTANCE D'UN CONFLIT PAR TYPE DE RÉUNION, CE QUE LA SALLE EN MONTRE.
       *
       * `ConflictDialog` dérive l'importance de `isExternal` (client vs interne). Verdal/Pharmatek est client/client
       * (cas « même type ») ; `demo-event-interne-chevauchement` pose un point interne PENDANT le comité de pilotage
       * Verdal (cas « le client pèse davantage »). Les types Renouvellement/Entretien consultant (#2102.35/.36) et les
       * inconnues par bloc (#2102.31) se calculent à l'ouverture du brief : rien à semer de plus.
       */
      export const DEMO_AGENDA_CONFLICT_IMPORTANCE_COVERAGE: Readonly<{ state: 'seede'; reason: string }> = {
        state: 'seede',
        reason:
          "`demo-event-interne-chevauchement` (demo-agenda.ts) chevauche `demo-event-verdal-comite` : conflit client/interne, vu par `ConflictDialog` (ligne d'importance par carte + phrase « le client pèse davantage »). Voir `demo-agenda-conflict-importance-coverage.spec.ts`.",
      }
