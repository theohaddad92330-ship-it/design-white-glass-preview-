lot: correctifs-vieilles-31-10-v4
issues: [2160, 2197, 2200, 2395]

changelog:
  id: 2026-10-31-correctifs-vieilles-v4
  comment: 'Vieilles issues vague 4 (#2160.9 #2197.9 #2200.13 #2395.8) — responsable en en-tête, société facturante dès xl, traçabilité des cartes à valider, résultat attendu requis'
  fr:
    date: 31 octobre 2026
    title: Plus de contexte sur tes fiches et tes validations
    items:
      - Le responsable du contact s’affiche aussi en tête de la fiche contact, ou « Non attribué ».
      - La colonne « Société facturante » est visible dès 1 280 px sur la facturation des missions.
      - Les cartes à valider (messages de séquence, relances) disent qui les a préparées, d’où elles viennent et la prochaine action.
      - Créer une action du plan exige maintenant un objectif et un résultat attendu, avec un message qui nomme ce qui manque.
  en:
    date: October 31, 2026
    title: More context on your records and approvals
    items:
      - The contact owner now also shows at the top of the contact page, or "Unassigned".
      - The "Billing entity" column is visible from 1,280 px on mission invoicing.
      - Cards to approve (sequence messages, follow-ups) say who prepared them, where they come from and the next action.
      - Creating a plan action now requires an objective and an expected result, with a message naming what is missing.
