changelog:
  id: 2026-11-02-lot-775
  comment: 'Lot 775 — Mémoire marché : les parcours individuels entrent, sans identité (décision Louis 02/11/2026)'
  fr:
    date: 2 novembre 2026
    title: 'Signaux : les missions observées sur le marché chez vos comptes'
    items:
      - 'L’historique des besoins (onglet « Signaux et besoins » d’un compte et Signaux › Historique) affiche des lignes « Mission observée » : « Un freelance Data Engineer · 2023-2024 · via une ESN · Java, Kafka · TJM ≈ 650 € », source « Mémoire marché ». Elles se filtrent par techno, zone et période et se trouvent par la recherche.'
      - 'Aucune identité : ni nom, prénom, genre, téléphone, e-mail, URL de profil, photo, adresse ni âge n’entre dans le produit. Une mission s’affiche même seule, puisqu’elle ne désigne personne ; les agrégats gardent leur seuil de 3.'
      - 'Les contacts proposés suivent la règle habituelle (métier et lieu) : jamais la personne du parcours.'
  en:
    date: November 2, 2026
    title: 'Signals: the assignments observed on the market at your accounts'
    items:
      - 'The needs history (an account’s "Signals and needs" tab and Signals › History) shows "Observed assignment" rows: "A freelance Data Engineer · 2023-2024 · via an ESN · Java, Kafka · daily rate ≈ €650", source "Market memory". They filter by technology, area and period and are found by search.'
      - 'No identity: no name, first name, gender, phone, e-mail, profile URL, photo, address or age enters the product. An assignment shows even alone, since it identifies nobody; aggregates keep their threshold of 3.'
      - 'Suggested contacts follow the usual rule (job and place): never the person behind the path.'
