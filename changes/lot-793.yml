changelog:
  id: 2026-11-04-lot-793-pivot-entreprise
  comment: 'Lot 793 — le référentiel pivot relie le compte de l’espace aux entreprises de la base commune, par SIREN, site web ou nom unique'
  fr:
    date: 4 novembre 2026
    title: Un compte retrouve ses besoins et parcours même sans SIREN
    items:
      - 'L’historique d’un compte rattache désormais les besoins et les missions observées de la base commune par le SIREN, puis le site web, puis un nom sans homonyme — filiales du groupe comprises, avec leur entité nommée.'
      - Un nom porté par plusieurs entreprises ne rattache rien plutôt que de deviner.
  en:
    date: November 4, 2026
    title: An account finds its needs and paths even without a SIREN
    items:
      - 'An account’s history now links needs and observed missions from the shared base by SIREN, then website, then a name with no namesake — group subsidiaries included, with their entity named.'
      - A name shared by several companies links nothing rather than guessing.
