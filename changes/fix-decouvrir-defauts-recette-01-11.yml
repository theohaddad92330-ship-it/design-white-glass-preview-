changelog:
  id: 2026-11-01-fix-decouvrir-defauts-recette
  comment: 'Découvrir — cinq défauts relevés en recette prod du 01/11 (#4732.1 #4814.1 #4677.4 #4433.3 #4793.1)'
  fr:
    date: 1 novembre 2026
    title: 'Découvrir : rachats et fusions, vrais clients finaux, zone qui monte d’un palier'
    items:
      - 'Dans « Cadrer la recherche › Signaux », « Rachat ou fusion » se coche comme l’augmentation de capital : seuls les comptes qui en portent un, daté et avec son annonce, restent.'
      - '« Clients finaux » retire toute la famille des cabinets et ESN connus (et pas seulement quelques noms), ainsi que l’intérim, les plateformes de fournisseurs, l’infogérance et les apporteurs d’affaires.'
      - 'Quand le temps imparti coupe la recherche des signaux de plusieurs entreprises, la page le dit en une phrase ; ils s’ajoutent aux cartes dès qu’ils sont lus.'
      - '« Élargir la zone » monte d’un palier (département, puis région) au lieu de retirer la ville ; les comptes ajoutés portent leur étiquette « Élargi ». Jamais toute la France d’office.'
      - 'Un compte venu de la base commune se reconnaît sur sa carte : « Repéré dans la base commune ».'
  en:
    date: November 1, 2026
    title: 'Discover: takeovers and mergers, real end clients, a zone that climbs one step'
    items:
      - 'In “Frame the search › Signals”, “Takeover or merger” ticks like the capital increase: only accounts that carry one, dated and with its notice, stay.'
      - '“End clients” removes the whole family of known firms and IT service companies (not just a few names), as well as temp agencies, vendor platforms, managed services and business referrers.'
      - 'When the allowed time cuts the signals search for several companies, the page says so in one sentence; they are added to the cards as soon as they are read.'
      - '“Widen the zone” climbs one step (department, then region) instead of removing the city; added accounts carry their “Widened” label. Never the whole of France by default.'
      - 'An account that came from the shared base is recognisable on its card: “Spotted in the shared base”.'
