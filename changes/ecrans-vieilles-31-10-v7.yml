  id: 2026-10-31-ecrans-vieilles-v7
  comment: 'Écrans vus en recette prod 31/10, vague 7 (#2915.3 historique des analyses, #4137 archivage des affaires, /pipeline)'
  fr:
    date: 31 octobre 2026
    title: Historique des analyses, archivage des affaires et ancien lien Pipeline
    items:
      - 'L’historique des analyses d’un compte affiche la date et l’heure locale (« 31/10 à 14:05 »).'
      - 'Archiver une affaire la retire tout de suite du kanban, y compris après rechargement ; la désarchiver la retire de la liste « Archivées » et la remet au kanban.'
      - 'L’ancien lien /pipeline ouvre les affaires au lieu d’une page introuvable.'
  en:
    date: October 31, 2026
    title: Analysis history, deal archiving and the old Pipeline link
    items:
      - "An account's analysis history shows the local date and time (31/10 at 14:05)."
      - 'Archiving a deal removes it from the kanban right away, also after a reload; unarchiving it removes it from the "Archived" list and puts it back on the kanban.'
      - 'The old /pipeline link opens the deals instead of a not-found page.'
