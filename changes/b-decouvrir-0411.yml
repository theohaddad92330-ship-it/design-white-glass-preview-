  id: 2026-11-04-decouvrir-coupe-dite
  comment: 'Découvrir : la coupe à la limite se dit (#4706.1), la mémoire de marché ne bloque plus la recherche (#4617.6)'
  fr:
    date: 4 novembre 2026
    title: Découvrir — la coupe se dit, la recherche ne s’interrompt plus
    items:
      - 'Quand la liste est coupée à la limite, l’écran le dit : « 24 comptes affichés sur au moins 31 trouvés ». La limite n’est pas relevée.'
      - 'Une lecture trop lente de la mémoire de marché ne fait plus échouer la recherche : la liste s’affiche avec ce qui a été lu, et le reste est nommé.'
  en:
    date: November 4, 2026
    title: Discover — the cut is stated, the search no longer stalls
    items:
      - 'When the list is cut at the limit, the screen says so: "24 accounts shown of at least 31 found". The limit is not raised.'
      - 'A slow market-memory read no longer fails the search: the list shows what was read, and the rest is named.'
