issues: [4595, 4691]

changelog:
  id: 2026-10-31-ecrans-vieilles-v6
  comment: 'Écrans (#4595.3 #4691.3) — une mesure absente dit « non mesuré » au back-office ; /integrations ne propose que les écritures permises'
  fr:
    date: 31 octobre 2026
    title: Ce qui n’est pas mesuré ou pas permis ne s’affiche plus comme possible
    items:
      - 'Back-office : une mesure absente affiche « non mesuré » (avec sa raison quand on la connaît), plus jamais « 0 ».'
      - 'Intégrations : la carte BoondManager ne propose que les écritures dont le droit a été accordé, et le dit quand aucune ne l’est.'
  en:
    date: October 31, 2026
    title: What is unmeasured or not allowed no longer shows as possible
    items:
      - 'Back-office: a missing measure shows “not measured” (with the reason when known), never “0”.'
      - 'Integrations: the BoondManager card only offers the writes whose permission was granted, and says so when none is.'
