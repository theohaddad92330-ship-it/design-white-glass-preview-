changelog:
  id: 2026-10-31-correctifs-recette-v3
  comment: 'Correctifs vus en recette prod 31/10, vague 3 (#4197.2 #4167.3 #4197.4 #2732.1 #2732.2 #5022.1 #2276.61 brouillon Laura)'
  fr:
    date: 31 octobre 2026
    title: Anciens liens, planning, imports et cloche de Laura
    items:
      - 'Les anciens liens vers le Board des missions et vers Parcours ouvrent leur nouvelle place au lieu d’« introuvable ».'
      - 'Le planning des missions propose les fenêtres 30, 60 et 90 jours et une colonne Renouvellement (« — » quand il est inconnu).'
      - 'L’import de missions écrit vraiment les missions ; chaque ligne refusée est nommée avec sa raison. Les écrans d’import disent les formats lus avant le dépôt.'
      - 'La fin d’un job de Laura (terminé, partiel, échoué, incertain) arrive dans la cloche, pour la personne qui l’a lancé.'
      - 'Le brouillon de Laura est gardé par conversation ; deux onglets ne mélangent plus leur saisie.'
  en:
    date: October 31, 2026
    title: Old links, planning, imports and Laura's bell
    items:
      - 'Old links to the missions Board and to Parcours now open their new place instead of "not found".'
      - 'The missions planning offers 30, 60 and 90 day windows and a Renewal column ("—" when unknown).'
      - 'The missions import now really writes the missions; every refused row is named with its reason. Import screens state the formats read before you drop a file.'
      - 'The end of a Laura job (done, partial, failed, uncertain) reaches the bell, for the person who started it.'
      - "Laura's draft is kept per conversation; two tabs no longer mix their typing."
