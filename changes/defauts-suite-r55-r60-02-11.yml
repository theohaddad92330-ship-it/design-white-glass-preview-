  id: 2026-11-02-defauts-suite-r55-r60
  comment: 'Suite des défauts r55-r60 (#2200 #4291) — une seule formule d’auteur, le suivi des projets gagnés dans Planning'
  fr:
    date: 2 novembre 2026
    title: Recettes r55-r60, suite — une demande dit partout qui l’a lancée
    items:
      - 'Une demande « À valider » dit la même chose dans la liste et dans sa fenêtre : qui l’a déclenchée, depuis quoi, et que Laura l’a préparée ; la fenêtre ajoute la prochaine étape.'
      - 'Les projets gagnés se suivent dans Planning : Projets y renvoie en une ligne, et le clic sur un projet signé du Planning ouvre son suivi.'
  en:
    date: November 2, 2026
    title: Acceptance rounds r55-r60, continued — a request says everywhere who started it
    items:
      - 'A “To approve” request reads the same in the list and in its window: who triggered it, from what, and that Laura prepared it; the window adds the next step.'
      - 'Won projects are tracked in Planning: Projects links there in one line, and clicking a signed project in Planning opens its follow-up.'
