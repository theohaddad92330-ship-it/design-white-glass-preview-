changelog:
  id: 2026-11-04-c2-contacts-entite
  comment: 'Lot C2 (#4928.5) — le geste « Écarter les contacts de cette entité » devient annulable d’un clic'
  fr:
    date: 4 novembre 2026
    title: Écarter une entité, et revenir en arrière
    items:
      - 'Contacts d’un compte : après « Écarter les contacts de cette entité », « Annuler » réintègre aussitôt les contacts écartés avec elle. Un contact écarté à la main pour une autre raison n’est jamais retouché.'
  en:
    date: November 4, 2026
    title: Dismiss an entity, and take it back
    items:
      - 'Account contacts: after “Dismiss this entity’s contacts”, “Undo” restores the contacts dismissed with it at once. A contact dismissed by hand for another reason is never touched.'
