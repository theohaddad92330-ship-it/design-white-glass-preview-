changelog:
  id: 2026-11-01-lot-770
  comment: 'Lot 770 (#5069) — le rayon en km couvre toutes les communes (référentiel figé INSEE/IGN)'
  fr:
    date: 1 novembre 2026
    title: Rayon en km sur toutes les communes
    items:
      - 'Rayon en km : toutes les communes. Un « 30 km » autour de Lille garde désormais Roubaix, Tourcoing et Villeneuve-d’Ascq, et plus seulement 19 grandes villes.'
      - 'Un nom de commune partagé (« Saint-Denis ») ne reçoit une distance que si son département la départage : sinon, la règle du nom, jamais une distance devinée.'
  en:
    date: November 1, 2026
    title: Radius in km for every commune
    items:
      - 'Radius in km: all communes. A “30 km” around Lille now keeps Roubaix, Tourcoing and Villeneuve-d’Ascq, not just 19 large cities.'
      - 'A shared commune name (“Saint-Denis”) only gets a distance when its department tells it apart: otherwise the name rule applies, never a guessed distance.'
