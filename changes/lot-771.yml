changelog:
  id: 2026-11-01-lot-771
  comment: 'Lot 771 (#5004) — Signaux : les faits ne passent plus pour des projets ; chaque besoin dit sa source et ouvre son offre'
  fr:
    date: 1 novembre 2026
    title: 'Signaux : les faits ne passent plus pour des projets'
    items:
      - 'Une ligne qui décrit l’identité ou les chiffres de l’entreprise (forme sociale, capital, siège, effectif, dirigeants, chiffre d’affaires, comptes, rapport RSE publié) est un Fait, plus un Projet : elle ne porte plus « Projet possible » et les compteurs « Projet » et « projets possibles à trancher » suivent. Un vrai projet (migration, refonte, programme, appel d’offres) reste un projet.'
      - 'Un même fait lu au jour et au mois (« Changement de dirigeant enregistré… ») ne s’affiche plus qu’une fois dans « Autres faits ».'
      - 'Sous chaque titre : « Offre d’emploi · mai 2026 », « Marché public », « Annonce légale », « CRM », « Besoin observé sur le marché »… la source, plus le type déjà dit par la pastille.'
      - 'Les offres de recrutement ouvrent « Voir l’offre » quand le lien est connu, avec leurs compétences et leur TJM ≈ N € ; absents, rien n’est affiché.'
  en:
    date: November 1, 2026
    title: 'Signals: facts no longer pass for projects'
    items:
      - 'A line describing the company’s identity or figures (legal form, capital, head office, headcount, officers, revenue, accounts, published CSR report) is a Fact, no longer a Project: it carries no "Possible project" and the "Project" and "possible projects to settle" counters follow. A real project (migration, overhaul, programme, tender) stays a project.'
      - 'The same fact read at day and month precision ("Change of officer recorded…") shows only once in "Other facts".'
      - 'Under each title: "Job ad · May 2026", "Public tender", "Legal notice", "CRM", "Need observed on the market"… the source, no longer the type the badge already says.'
      - 'Hiring lines open "View the job ad" when the link is known, with their skills and day rate ≈ €N; when absent, nothing is shown.'
