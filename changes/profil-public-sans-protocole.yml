    date: 31 octobre 2026
    title: Fiche talent modifiable même avec un LinkedIn lu sans « https:// »
    items:
      - 'Un profil public lu dans un CV sans « https:// » ne bloque plus la modification de la fiche : l’adresse est complétée.'
  en:
