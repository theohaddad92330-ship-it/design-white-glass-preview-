changelog:
  id: 2026-11-01-lot-766
  comment: 'Lot 766 (#5065) — finitions Signaux après recette prod du 01/11'
  fr:
    date: 1 novembre 2026
    title: 'Signaux : des raisons de contact qui veulent dire quelque chose'
    items:
      - 'La raison d’un contact ne cite plus le nom du compte, un mot vide (« secteur », « tech », « offre »…) ni une ville : un lieu commun se lit « même lieu », et sans mot significatif le critère ne compte pas.'
      - 'La carte d’un signal est plus basse : une ligne « type · date » sous le titre, « Projet possible » compact en ligne.'
      - 'Les dépôts de comptes de l’historique se regroupent en une ligne « N dépôts de comptes », dépliable ; la phrase de synthèse ne se lit plus qu’une fois.'
      - 'Le badge « Collecte antérieure » s’explique au clavier, et /signals › Historique compte partout en « besoins passés ».'
  en:
    date: November 1, 2026
    title: 'Signals: contact reasons that actually mean something'
    items:
      - 'A contact reason no longer cites the account name, an empty word ("sector", "tech", "offer"…) or a city: a shared place reads "same place", and with no meaningful word the criterion does not count.'
      - 'A signal card is shorter: one "type · date" line under the title, a compact inline "Possible project".'
      - 'History account filings group into one expandable "N accounts filings" row; the summary sentence now appears only once.'
      - 'The "Collected before" badge explains itself by keyboard, and /signals › History counts "past needs" everywhere.'
