changelog:
  id: 2026-11-02-lot-773
  comment: 'Lot 773 (#5004) — Signaux : historique lisible, besoins de tout le groupe, mémoire marché détaillée'
  fr:
    date: 2 novembre 2026
    title: 'Signaux : un historique qu’on lit d’un coup d’œil, les besoins de tout le groupe, et ce que le marché a vu'
    items:
      - 'Chaque besoin passé tient sur une ligne (type, titre, source · date, contacts) et se déplie au clic ou à Entrée ; c’est la même ligne dans Signaux › Historique et dans l’onglet « Signaux et besoins » d’un compte.'
      - 'Les phrases d’un même fait (même type, même mois, mêmes noms propres) ne font plus qu’une ligne « ×N sources » : le dépli liste les formulations, le compteur compte les lignes regroupées. Rien n’est supprimé.'
      - '« Personne de connu ne recoupe » et « Trouver qui contacter » ne s’écrivent plus qu’une fois par compte, jamais sur chaque ligne ; un dépli long montre 5 besoins puis « Voir les N autres ».'
      - 'La base commune se lit par groupe : un SIREN porté par plusieurs fiches rend les besoins de toutes les fiches du groupe (« Base commune · entité », « N besoins sur M entités du groupe ») au lieu de se taire ; un vrai doute entre deux groupes ne rend rien et laisse une trace.'
      - 'L’encart « Observé sur le marché » dit ce que la mémoire marché sait du compte : technos les plus vues, familles de rôles, ESN et ex-ESN présentes avec leur nombre de parcours (seuil de 3), et renvoie à l’Écosystème pour le détail. Aucune personne, aucune date.'
  en:
    date: November 2, 2026
    title: 'Signals: a history you read at a glance, the whole group’s needs, and what the market has seen'
    items:
      - 'Each past need fits on one line (type, title, source · date, contacts) and opens on click or Enter; it is the same row in Signals › History and in an account’s "Signals and needs" tab.'
      - 'Phrasings of the same fact (same type, same month, same proper names) are now one "×N sources" row: the expanded view lists the phrasings, and the counter counts grouped rows. Nothing is deleted.'
      - '"Nobody known matches" and "Find who to contact" are written once per account, never on every row; a long expanded view shows 5 needs then "Show the other N".'
      - 'The shared base is read by group: a SIREN carried by several records returns the needs of every record in the group ("Shared base · entity", "N needs across M group entities") instead of staying silent; a real doubt between two groups returns nothing and leaves a trace.'
      - 'The "Observed on the market" card says what market memory knows about the account: most seen technologies, role families, ESN and former-ESN staff with their number of career paths (threshold of 3), and points to the Ecosystem tab for details. No person, no date.'
