    title: Acceptance rounds r55-r60 — what shipped is now visible
    items:
      - 'The trajectory verdict and portfolio coverage now open in Pilotage › Cockpit.'
      - 'The “To approve” card names who triggered the request and the next step.'
      - 'The account page offers a BU selector, reserved to those who can edit the account, and its job offers show their contract type.'
      - 'A Laura job replaced in its thread becomes “Obsolete”; a job with incomplete parameters is born “Draft”.'
      - 'A need’s quality summary follows the page verdict, “Create” a task names the missing field, and a talent-pool import rejects a nameless line and says why.'
