issues: [4290, 4107, 2616, 2128, 4295, 4556, 4116]

changelog:
  id: 2026-11-01-fix-demo-defauts-d3
  comment: 'Salle de démo : les défauts trouvés par la recette D3 (motif d’écartement, e-mail vérifié, sources de recrutement, analyse par un collègue, relation « ne pas contacter », zone Occitanie, marqueur UE)'
  fr:
    date: 1 novembre 2026
    title: Démo plus fidèle et défauts d’affichage corrigés
    items:
      - 'Un contact écarté affiche son motif (par exemple « A quitté l’entreprise ») sur la fiche du compte.'
      - 'Un contact « ne pas contacter » ne se lit plus « À contacter » dans la liste des contacts.'
      - 'Démo : un e-mail vérifié sur une fiche SNCF, des signaux de recrutement avec leurs sources (APEC, Welcome to the Jungle, ATS) et le CDI, une analyse en cours par un collègue, les contacts du siège d’Airbus « En zone » en Occitanie et un appel d’offres européen repéré.'
  en:
    date: November 1, 2026
    title: More faithful demo and display defects fixed
    items:
      - 'A dismissed contact shows its reason (for example "Left the company") on the account record.'
      - 'A "do not contact" contact no longer reads "To contact" in the contacts list.'
      - 'Demo: a verified email on a SNCF record, hiring signals with their sources (APEC, Welcome to the Jungle, ATS) and the permanent contract, an analysis in progress by a colleague, Airbus headquarters contacts "In zone" in Occitanie and a flagged European tender.'
