issues: [2170, 2152]

changelog:
  id: 2026-10-31-vieilles-l4-pipe-ao
  comment: 'Lot L4 (#2170.43 #2170.53 #2170.5 #2152.27 #2152.25) — seuils de stagnation par étape, AO validé avant génération'
  fr:
    date: 31 octobre 2026
    title: Le pipe suit vos seuils d’étape, l’AO se valide avant d’être rédigé
    items:
      - 'Pipe : l’alerte « vieillissante » suit la durée cible réglée pour chaque étape (Règles → Pipe) ; seuls le propriétaire et les administrateurs la modifient.'
      - 'Laura : la question d’un dossier du pipe nomme le compte, les profils en entretien et l’immobilité au-delà du seuil.'
      - 'Appels d’offres : « Rédiger » ouvre d’abord la validation des sources que Laura peut citer.'
      - 'Appels d’offres : un AO lié à un besoin permet d’y rattacher des profils du vivier.'
  en:
    date: October 31, 2026
    title: The pipeline follows your stage thresholds, tenders are approved before drafting
    items:
      - 'Pipeline: the "ageing" alert follows the target duration set for each stage (Rules → Pipeline); only the owner and admins can change it.'
      - 'Laura: the question for a pipeline deal names the account, the profiles in interviews and how long it has not moved past the threshold.'
      - 'Tenders: "Draft" first opens the approval of the sources Laura may cite.'
      - 'Tenders: a tender linked to a need lets you attach bench profiles to it.'
