changelog:
  id: 2026-11-01-lot-772
  comment: 'Lot 772 (#4816 #5004) — Signaux : recherche, zones, typage des offres et sources sur vos vrais comptes'
  fr:
    date: 1 novembre 2026
    title: 'Signaux : qui contacter, recherche et zones qui marchent sur vos vrais comptes'
    items:
      - 'La zone d’un besoin passé se lit d’abord dans son lieu, puis dans le lieu de son intitulé (« … à Villeurbanne/Lyon »), puis dans le siège ou l’adresse du compte, résolus en région par le référentiel officiel des communes : le filtre « Zone » propose enfin toutes les régions de vos comptes. Sans lieu lisible, un besoin n’est dans aucune zone.'
      - 'Les offres reformulées par l’analyse (« publie une offre CDI de… », « Une offre de Product Owner a été publiée », « recrute un… », « poste de… ») sont des offres d’emploi, y compris dans les projets possibles ; une nomination reste un fait d’équipe.'
      - 'La recherche surligne aussi les débuts de mot qu’elle compte (« product » dans « Production ») et lit les titres des lignes regroupées.'
      - 'La source d’un signal se nomme par sa nature (Presse, Offre d’emploi, Marché public, Annonce légale, Site de l’entreprise), jamais par son domaine ; l’adresse reste derrière le lien.'
      - 'L’Historique affiche un squelette de liste pendant son chargement, et sa lecture est plus rapide sur les comptes à milliers de lignes.'
  en:
    date: November 1, 2026
    title: 'Signals: who to contact, search and zones that work on your real accounts'
    items:
      - 'A past need’s zone is read first from its place, then from the place in its title ("… in Villeurbanne/Lyon"), then from the account’s head office or address, resolved to a region by the official communes reference: the "Zone" filter now offers every region your accounts cover. With no readable place, a need is in no zone.'
      - 'Offers rephrased by the analysis ("publishes a permanent job offer for…", "A Product Owner offer was published", "is hiring a…", "position of…") are job offers, including among possible projects; an appointment stays a team fact.'
      - 'Search also highlights the word beginnings it counts ("product" in "Production") and reads the titles of grouped lines.'
      - 'A signal’s source is named by its nature (Press, Job ad, Public tender, Legal notice, Company website), never by its domain; the address stays behind the link.'
      - 'History shows a list skeleton while loading, and reads faster on accounts with thousands of lines.'
