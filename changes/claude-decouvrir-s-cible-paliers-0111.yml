lot: decouvrir-s-cible-paliers-0111
issues: [4530, 4429, 4515]

changelog:
  id: 2026-11-01-decouvrir-s-cible-paliers
  comment: 'Lot S Découvrir (#4530, #4429, #4515) — Ma cible sans modale, zone élargie par paliers 25 → 50 km → département → région'
  fr:
    date: 1er novembre 2026
    title: Découvrir — Ma cible en un clic, la zone s’élargit barreau par barreau
    items:
      - '« Ma cible » active toujours ses critères, même quand le profil couvre plus de 5 secteurs : la coupe est dite, avec un lien pour la régler.'
      - 'Une ville part de 25 km, puis s’élargit à 50 km, au département, à la région — un barreau à la fois, chacun nommé au-dessus de la liste.'
      - 'Depuis 50 km, le geste dit « Revenir à Toulouse seule » ; ensuite il revient au barreau d’avant, jamais au rayon de départ.'
  en:
    date: November 1, 2026
    title: Discover — My target in one click, the zone widens one step at a time
    items:
      - '“My target” always applies its criteria, even when the profile covers more than 5 sectors: the cut is stated, with a link to adjust it.'
      - 'A city starts at 25 km, then widens to 50 km, the department, the region — one step at a time, each named above the list.'
      - 'From 50 km the gesture reads “Back to Toulouse only”; after that it returns to the previous step, never to the starting radius.'
