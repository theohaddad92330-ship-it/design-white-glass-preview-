changelog:
  id: 2026-10-31-lot-763
  comment: 'Lot 763 (#5031) — la carte d’un signal se lit d’un coup d’œil'
  fr:
    date: 31 octobre 2026
    title: La carte d’un signal se lit d’un coup d’œil
    items:
      - 'Le bloc « Projet possible » ne répète plus le titre : Confirmer ou Écarter, sur une seule ligne.'
      - 'Chaque contact dit précisément pourquoi il est proposé : nommé dans l’annonce, même métier ou même lieu.'
      - 'Le titre tient sur deux lignes, la bascule Actuel / Historique n’est plus rognée, et les établissements fermés se regroupent en une ligne dépliable.'
  en:
    date: October 31, 2026
    title: A signal card reads at a glance
    items:
      - 'The “Possible project” block no longer repeats the title: Confirm or Dismiss, on a single line.'
      - 'Each contact says exactly why it is suggested: named in the notice, same craft or same place.'
      - 'The title fits on two lines, the Current / History toggle is no longer clipped, and closed establishments are grouped into one expandable line.'
