lot: laura-interrupteur-profil-l5b
issues: [5048, 5046]

changelog:
  id: 2026-11-01-laura-interrupteur-profil
  comment: 'Lot L5b (#5048 #5046) — Mon profil devient un interrupteur ; le menu Outils renvoie vers Intégrations'
  fr:
    date: 1 novembre 2026
    title: Mon profil, d’un geste
    items:
      - 'Dans le composeur, « Mon profil » est un interrupteur : allumé, {{copilot}} s’appuie sur ton activité ; éteint, il répond sans ton profil.'
      - 'Une mission ponctuelle posée dans le panneau de portée s’affiche éteinte et nommée ; rallumer l’interrupteur revient à Mon activité.'
      - 'Dans « Outils et sources », un outil à reconnecter porte un lien « À reconnecter » vers Intégrations, et la précision « ne déconnecte aucun compte » passe en bas du menu.'
  en:
    date: November 1, 2026
    title: My profile, in one tap
    items:
      - 'In the composer, “My profile” is a switch: on, {{copilot}} draws on your activity; off, it answers without your profile.'
      - 'A one-off mission set in the scope panel shows as off and named; switching back on returns to My activity.'
      - 'In “Tools and sources”, a tool to reconnect carries a “Reconnect” link to Integrations, and the “does not disconnect any account” note moves to the bottom of the menu.'
