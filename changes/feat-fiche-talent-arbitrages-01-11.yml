lot: feat-fiche-talent-arbitrages-01-11
issues: [4543, 4577, 4576]

changelog:
  id: 2026-11-01-fiche-talent-arbitrages
  comment: 'Fiche talent : « Saisi à la main » champ par champ, en-tête à la forme de la maquette V22, brief de compte « non renseigné » (#4577.3 #4577.6 #4576.5 #4576.9 #4543.5)'
  fr:
    date: 1 novembre 2026
    title: La fiche talent dit ce qui est saisi à la main
    items:
      - 'Sur la fiche d’un talent, un champ corrigé à la main le dit (« Saisi à la main ») et n’est jamais écrasé par une resynchronisation ou un réimport.'
      - 'Tous les champs restent modifiables, même ceux venus d’un connecteur ou d’un CV ; sans le droit d’écriture, la fiche se lit sans rien promettre.'
      - 'L’en-tête de la fiche talent suit la maquette : un titre, une ligne métier et lieu, une ligne de statut, de suivi et de mise à jour, les gestes à droite.'
      - 'Dans le brief de compte, une concurrence ou des achats que l’analyse n’a pas relevés se disent « non renseignés », jamais « rien à signaler ».'
  en:
    date: November 1, 2026
    title: The talent record says what was entered by hand
    items:
      - 'On a talent record, a field corrected by hand says so ("Entered manually") and is never overwritten by a resync or a re-import.'
      - 'Every field stays editable, even those that came from a connector or a CV; without write access the record reads without promising anything.'
      - 'The talent record header follows the mockup: one title, a role and place line, a status, owner and last-update line, actions on the right.'
      - 'In the account brief, competitors or purchasing the analysis did not find are shown as "not provided", never "nothing to report".'
