changelog:
  id: 2026-11-03-lot-788
  comment: 'Lot 788 (#5203) — Découvrir : filtre de besoins sans faux bandeau, sélecteur consultant propre, recherche Historique gardée'
  fr:
    date: 3 novembre 2026
    title: Besoins connus et Historique plus nets
    items:
      - 'Le filtre « Anciens » ne montre plus un bandeau de source refusée sous sa réponse, et le nombre de cartes retirées ne compte que celles que l’écran aurait montrées.'
      - 'Le sélecteur « Depuis un consultant » n’a plus de doublon de libellé ni de « Consultant N » : une fiche sans nom ni poste n’apparaît pas.'
      - 'Dans Signaux › Historique, une recherche sans résultat garde son champ et propose de l’effacer.'
  en:
    date: November 3, 2026
    title: Cleaner known needs and History
    items:
      - 'The “Old” filter no longer shows a refused-source banner under its answer, and the removed-cards count only includes cards the screen would have shown.'
      - 'The “From a consultant” picker has no duplicate labels and no “Consultant N”: a record with neither name nor title is not listed.'
      - 'In Signals › History, a search with no result keeps its field and offers to clear it.'
