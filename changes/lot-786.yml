changelog:
  id: 2026-11-03-lot-786
  comment: 'Lot 786 (#5203) — Découvrir : « Anciens » retire au lieu de casser, la région tapée en fin de phrase est posée, le sélecteur de consultants sans doublon'
  fr:
    date: 3 novembre 2026
    title: Découvrir — filtre « Anciens », région tapée, consultants sans doublon
    items:
      - 'Quand le filtre « Besoins connus » retire toutes les cartes, l’écran le dit au lieu d’afficher « résultat non vérifiable ».'
      - 'Une région nommée en fin de phrase (« SAP Île-de-France ») est posée comme zone, comme une ville.'
      - 'Le sélecteur « Depuis un consultant » ne montre plus la même personne deux fois, ni « Consultant N » quand un poste existe.'
  en:
    date: November 3, 2026
    title: Discover — "Older" filter, typed region, consultants without duplicates
    items:
      - 'When the "Known needs" filter removes every card, the screen says so instead of showing "result not verifiable".'
      - 'A region named at the end of a sentence ("SAP Île-de-France") is set as the area, like a city.'
      - 'The "From a consultant" picker no longer shows the same person twice, nor "Consultant N" when a job title exists.'
