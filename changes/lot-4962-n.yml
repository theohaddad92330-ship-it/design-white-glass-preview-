changelog:
  id: 2026-10-31-lot-4962-n
  comment: 'Lot N (#5029) — proposer un consultant en intercontrat à un compte, une séquence relue à la main'
  fr:
    date: 31 octobre 2026
    title: Proposer un consultant en intercontrat, compte par compte
    items:
      - Sur le Reverse Market d’un consultant, « Proposer ce profil » prépare une séquence vers UN interlocuteur du compte.
      - Le premier e-mail présente le profil anonymisé, sans nom ni tarif, et cite le besoin du compte.
      - Chaque e-mail se relit et se valide à la main, même si l’espace a signé un mandat d’envoi automatique.
      - « Déjà proposé à ce compte » s’affiche quand ce profil y a déjà été proposé.
  en:
    date: October 31, 2026
    title: Propose a benched consultant, one account at a time
    items:
      - On a consultant’s Reverse Market, “Propose this profile” prepares a sequence to ONE contact at the account.
      - The first email presents the anonymised profile, with no name or rate, and cites the account’s need.
      - Every email is reviewed and approved by hand, even when the workspace has signed an automatic sending mandate.
      - “Already proposed to this account” shows when this profile has already been proposed there.

