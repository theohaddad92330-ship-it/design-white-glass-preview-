changelog:
  id: 2026-10-31-doublons-personnes-decision
  comment: 'Vieilles issues v5 (#4114.4) — décider une paire de doublons de personnes'
  fr:
    date: 31 octobre 2026
    title: Tu tranches les doublons de personnes
    items:
      - 'Sur l’onglet Contacts d’un compte, chaque paire proposée a deux gestes : « Ce sont les mêmes » ou « Pas les mêmes ».'
      - Rien n’est fusionné: ta décision est enregistrée, et une paire écartée ne revient plus.
  en:
    date: October 31, 2026
    title: You settle duplicate people
    items:
      - 'On an account’s Contacts tab, each proposed pair now has two actions: “They are the same” or “Not the same”.'
      - Nothing is merged: your decision is saved, and a dismissed pair does not come back.
