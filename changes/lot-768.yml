changelog:
  id: 2026-11-01-lot-768
  comment: 'Lot 768 (#5066) — Signaux : la personne à contacter sur chaque besoin passé, et une recherche par pertinence'
  fr:
    date: 1 novembre 2026
    title: 'Signaux : qui contacter sur chaque besoin passé, et une recherche qui trouve'
    items:
      - 'Dans l’historique, chaque besoin passé propose une ou deux personnes à contacter, avec la raison précise, « Préparer le message » et « Au plan » — comme dans l’onglet du compte. Quand personne ne recoupe, l’écran propose « Trouver qui contacter ».'
      - 'La recherche des deux onglets (Actuel et Historique) range par pertinence : « power bi » trouve PowerBI, « po » trouve Product Owner, et le titre d’un besoin pèse plus que son détail. Les comptes remontent par leur meilleur besoin et les mots trouvés sont surlignés.'
      - 'La recherche est dans l’adresse de la page (?q=) : elle se partage et reste en place quand tu passes d’Actuel à Historique.'
  en:
    date: November 1, 2026
    title: 'Signals: who to contact on each past need, and a search that finds'
    items:
      - 'In history, each past need suggests one or two people to contact, with the precise reason, "Prepare the message" and "Add to plan" — as in the account tab. When nobody fits, the screen offers "Find who to contact".'
      - 'The search on both tabs (Current and History) ranks by relevance: "power bi" finds PowerBI, "po" finds Product Owner, and a need’s title weighs more than its detail. Accounts rise by their best need and the words found are highlighted.'
      - 'The search lives in the page address (?q=): it can be shared and stays put when you switch between Current and History.'
