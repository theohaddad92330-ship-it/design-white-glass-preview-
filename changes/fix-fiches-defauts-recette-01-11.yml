issues: [4813, 4345, 4802, 4198]

changelog:
  id: 2026-11-01-fix-fiches-defauts-recette
  comment: 'Recette prod 01/11 : badge dirigeant du groupe, Laura sur place dans le dossier projet, ordre des interlocuteurs selon l’état d’accès, libellé « Voir le compte »'
  fr:
    date: 1 novembre 2026
    title: Quatre défauts de fiche corrigés
    items:
      - 'Comité d’achat : le badge « Dirigeant du groupe » s’affiche aussi quand le dirigeant n’a ni niveau ni entité renseignés.'
      - 'Dossier d’une affaire : « Demander à Laura » ouvre Laura sur place, sans quitter la page.'
      - 'Onglet Accès : « À bâtir » met les décideurs et sponsors devant, « Référencé » met les utilisateurs et acheteurs devant, et « Accès inconnu » ne reste plus affiché à côté d’un état choisi.'
      - 'Liste des comptes : le bouton dit « Voir le compte ».'
  en:
    date: November 1, 2026
    title: Four record defects fixed
    items:
      - 'Buying committee: the "Group executive" badge now also shows when the executive has no level or entity set.'
      - 'Deal record: "Ask Laura" opens Laura in place, without leaving the page.'
      - 'Access tab: "To build" puts decision-makers and sponsors first, "Referenced" puts users and buyers first, and "Unknown access" no longer shows next to a chosen state.'
      - 'Accounts list: the button reads "View the account".'
