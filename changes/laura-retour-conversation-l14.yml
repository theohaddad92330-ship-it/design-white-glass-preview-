changelog:
  id: 2026-11-01-laura-retour-conversation-l14
  comment: 'Laura L14 (#4967) — au retour sur Laura, on retombe sur la conversation attendue, pas sur l’accueil'
  fr:
    date: 1er novembre 2026
    title: Laura vous ramène à votre conversation
    items:
      - 'Quand vous revenez sur Laura, vous retombez directement sur la conversation dont la recherche tourne encore, ou dont la réponse est arrivée pendant votre absence.'
      - 'Une réponse déjà vue ne vous ramène plus : l’accueil reste l’accueil, et « Nouvelle conversation » ou un lien précis sont toujours respectés.'
  en:
    date: November 1, 2026
    title: Laura takes you back to your conversation
    items:
      - 'When you come back to Laura, you land directly on the conversation whose search is still running, or whose answer arrived while you were away.'
      - 'An answer you already saw no longer brings you back: the home stays the home, and “New conversation” or a specific link is always respected.'

